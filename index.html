<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помощник репетитора</title>
<style>
:root{font-family:Arial,sans-serif;color:#20352d;background:#f4f7f5}
body{margin:0;padding:16px;max-width:760px;margin-inline:auto}
h1{font-size:1.7rem;margin-bottom:6px}
p{line-height:1.45}
.card{background:white;border:1px solid #dce6df;border-radius:16px;padding:16px;margin:14px 0}
label{display:block;font-weight:700;margin:12px 0 6px}
input,textarea,button{font:inherit;width:100%;box-sizing:border-box;border-radius:10px;padding:12px}
input,textarea{border:1px solid #b9c9bf;background:#fff}
textarea{min-height:80px;resize:vertical}
button{border:0;background:#16734a;color:white;font-weight:700;margin-top:10px;cursor:pointer}
button.secondary{background:#e7eee9;color:#20352d}
.item{border-top:1px solid #e1e8e3;padding:12px 0;overflow-wrap:anywhere}
.item:first-child{border-top:0}
.small{font-size:.92rem;color:#53675c}
.row{display:flex;gap:8px;align-items:center}
.row input[type=checkbox]{width:auto}
.row button{width:auto;margin:0;padding:8px 12px}
.status{font-size:.9rem;color:#53675c;margin-top:8px}
</style>
</head>
<body>
<h1>Помощник репетитора</h1>
<p>Записывай занятия и задачи. Данные сохраняются в этом браузере на этом устройстве.</p>

<section class="card">
<h2>Добавить занятие</h2>
<form id="lessonForm">
<label for="student">Имя ученика *</label>
<input id="student" required placeholder="Например, Анна">
<div class="row">
<div style="flex:1">
<label for="lessonDate">Дата</label>
<input id="lessonDate" type="date">
</div>
<div style="flex:1">
<label for="lessonTime">Время</label>
<input id="lessonTime" type="time">
</div>
</div>
<label for="lessonNote">Заметки о занятии</label>
<textarea id="lessonNote" placeholder="Что повторить, домашнее задание..."></textarea>
<button type="submit">Создать занятие</button>
<div class="status" id="lessonStatus" aria-live="polite"></div>
</form>
</section>

<section class="card">
<h2>Занятия</h2>
<label for="search">Поиск по имени</label>
<input id="search" placeholder="Начни вводить имя ученика">
<div id="lessonList" class="item small">Пока занятий нет.</div>
</section>

<section class="card">
<h2>Добавить задачу</h2>
<form id="taskForm">
<label for="taskText">Что нужно сделать? *</label>
<input id="taskText" required placeholder="Например, подготовить упражнения">
<button type="submit">Добавить задачу</button>
<div class="status" id="taskStatus" aria-live="polite"></div>
</form>
<h2>Мои задачи</h2>
<div id="taskList" class="item small">Пока задач нет.</div>
</section>

<script>
(function () {
  "use strict";
  var lessons = [];
  var tasks = [];

  function readSaved(key) {
    try {
      var saved = localStorage.getItem(key);
      return saved ? JSON.parse(saved) : [];
    } catch (e) {
      return [];
    }
  }

  function saveData() {
    try {
      localStorage.setItem("tutor_lessons_v2", JSON.stringify(lessons));
      localStorage.setItem("tutor_tasks_v2", JSON.stringify(tasks));
      return true;
    } catch (e) {
      return false;
    }
  }

  function makeButton(label, className, onClick) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = className || "secondary";
    button.textContent = label;
    button.addEventListener("click", onClick);
    return button;
  }

  function renderLessons() {
    var list = document.getElementById("lessonList");
    var query = document.getElementById("search").value.trim().toLowerCase();
    list.textContent = "";
    var visible = lessons.filter(function (lesson) {
      return lesson.student.toLowerCase().indexOf(query) !== -1;
    });

    if (visible.length === 0) {
      list.textContent = query ? "По этому имени занятий не найдено." : "Пока занятий нет.";
      list.className = "item small";
      return;
    }

    list.className = "";
    visible.forEach(function (lesson) {
      var item = document.createElement("div");
      item.className = "item";
      var title = document.createElement("strong");
      title.textContent = lesson.student;
      item.appendChild(title);

      var details = document.createElement("p");
      details.className = "small";
      details.textContent = [lesson.date, lesson.time, lesson.note].filter(Boolean).join(" · ") || "Без дополнительных заметок";
      item.appendChild(details);

      item.appendChild(makeButton("Удалить", "secondary", function () {
        lessons = lessons.filter(function (entry) { return entry.id !== lesson.id; });
        saveData();
        renderLessons();
      }));
      list.appendChild(item);
    });
  }

  function renderTasks() {
    var list = document.getElementById("taskList");
    list.textContent = "";
    if (tasks.length === 0) {
      list.textContent = "Пока задач нет.";
      list.className = "item small";
      return;
    }
    list.className = "";
    tasks.forEach(function (task) {
      var item = document.createElement("div");
      item.className = "item row";
      var check = document.createElement("input");
      check.type = "checkbox";
      check.checked = task.done;
      check.setAttribute("aria-label", "Отметить задачу выполненной");
      check.addEventListener("change", function () {
        task.done = check.checked;
        saveData();
        renderTasks();
      });
      var text = document.createElement("span");
      text.style.flex = "1";
      text.style.textDecoration = task.done ? "line-through" : "none";
      text.textContent = task.text;
      item.appendChild(check);
      item.appendChild(text);
      item.appendChild(makeButton("Удалить", "secondary", function () {
        tasks = tasks.filter(function (entry) { return entry.id !== task.id; });
        saveData();
        renderTasks();
      }));
      list.appendChild(item);
    });
  }

  document.getElementById("lessonForm").addEventListener("submit", function (event) {
    event.preventDefault();
    var student = document.getElementById("student").value.trim();
    if (!student) {
      document.getElementById("lessonStatus").textContent = "Укажи имя ученика.";
      return;
    }
    lessons.push({
      id: String(Date.now()) + Math.random().toString(16).slice(2),
      student: student,
      date: document.getElementById("lessonDate").value,
      time: document.getElementById("lessonTime").value,
      note: document.getElementById("lessonNote").value.trim()
    });
    var saved = saveData();
    document.getElementById("lessonForm").reset();
    document.getElementById("lessonStatus").textContent = saved ? "Занятие добавлено." : "Занятие добавлено, но браузер не разрешил сохранить данные.";
    renderLessons();
  });

  document.getElementById("taskForm").addEventListener("submit", function (event) {
    event.preventDefault();
    var text = document.getElementById("taskText").value.trim();
    if (!text) return;
    tasks.push({ id: String(Date.now()) + Math.random().toString(16).slice(2), text: text, done: false });
    var saved = saveData();
    document.getElementById("taskForm").reset();
    document.getElementById("taskStatus").textContent = saved ? "Задача добавлена." : "Задача добавлена, но браузер не разрешил сохранить данные.";
    renderTasks();
  });

  document.getElementById("search").addEventListener("input", renderLessons);

  lessons = readSaved("tutor_lessons_v2");
  tasks = readSaved("tutor_tasks_v2");
  if (!Array.isArray(lessons)) lessons = [];
  if (!Array.isArray(tasks)) tasks = [];
  renderLessons();
  renderTasks();
}());
</script>
</body>
</html>
